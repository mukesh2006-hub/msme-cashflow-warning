/* Layout concept: a command-console. Sticky instrument rail on the left, one live panel on the right; every number comes from one JSON payload shaped like the ML contract. */
:root{

}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background-color:var(--bg);background-image:linear-gradient(rgba(25,211,243,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(25,211,243,.05) 1px,transparent 1px);background-size:40px 40px;color:var(--fg);font:500 17px/1.4 var(--f-body);padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit}

  .alert{padding:16px}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmtL(v,d){return (v<0?'–':'')+'₹'+Math.abs(v/100000).toFixed(d==null?2:d)+' L';}
function fmtDate(s){var p=s.split('-');return MONTHS[+p[1]-1]+' '+(+p[2]);}
function fmtRange(a,b){if(a===b)return fmtDate(a);var x=a.split('-'),y=b.split('-');return fmtDate(a)+'–'+(x[1]===y[1]?(+y[2]):fmtDate(b));}
function addDays(s,n){var p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10);}

function build(o){
  var n=31,bal=[],lo=[],up=[],dates=[],inf=[],out=[],i,k,a,b,t,v,d;
  for(i=0;i<n;i++){
    k=0;while(k<o.pts.length-2&&o.pts[k+1][0]<=i)k++;
    a=o.pts[k];b=o.pts[k+1];
    t=Math.max(0,Math.min(1,(i-a[0])/(b[0]-a[0])));

    bal.push(Math.round(v));lo.push(Math.round(v-d));up.push(Math.round(v+d));dates.push(addDays(o.start,i));
  }
  var sizes=[7,7,7,7,3],day=0;
  sizes.forEach(function(sz,w){for(var j=0;j<sz;j++){inf[day]=Math.round(o.inT[w]*1e5/sz);out[day]=Math.round(o.outT[w]*1e5/sz);day++;}});
  if(o.emiDay!=null)out[o.emiDay]+=o.emiAmt;
  return {dates:dates,balance:bal,lower:lo,upper:up,inflows:inf,outflows:out};
}

/* chart helpers */
function cashChart(D){
  var F=D.forecast,n=F.balance.length,W=780,x0=60,x1=740,y0=20,y1=240,stepX=(x1-x0)/(n-1);
  var lo=Math.min(0,Math.min.apply(null,F.lower)/1e5),hi=Math.max.apply(null,F.upper)/1e5;
  var steps=[0.5,1,2,2.5,5,10,20,50],st=100,i;for(i=0;i<steps.length;i++){if((hi-lo)/steps[i]<=6){st=steps[i];break;}}
  var mn=Math.floor(lo/st)*st,mx=Math.ceil(hi/st)*st;
  function X(i){return x0+i*stepX;}function Y(v){return y0+(mx-v/1e5)/(mx-mn)*(y1-y0);}
  var s='<defs><filter id="glow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>';
  var neg=[];F.balance.forEach(function(v,i){if(v<0)neg.push(i);});
  if(neg.length){var a=X(neg[0])-stepX/2,b=X(neg[neg.length-1])+stepX/2;s+='<rect x="'+a+'" y="'+y0+'" width="'+(b-a)+'" height="'+(y1-y0)+'" fill="rgba(255,90,82,.16)"/>';}
  for(var t=mn;t<=mx+1e-9;t+=st){var yy=Y(t*1e5);s+='<line x1="'+x0+'" y1="'+yy+'" x2="'+x1+'" y2="'+yy+'" stroke="'+(t===0?'rgba(214,238,245,.55)':'rgba(25,211,243,.14)')+'" stroke-width="'+(t===0?1.5:1)+'"/><text x="52" y="'+(yy+4)+'" text-anchor="end" font-size="12" fill="#86A9B6">'+(t===0?'₹0':(t<0?'–':'')+'₹'+Math.abs(Math.round(t*10)/10)+' L')+'</text>';}
  var up=F.upper.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}),dn=F.lower.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).reverse();
  s+='<polygon points="'+up.join(' ')+' '+dn.join(' ')+'" fill="rgba(25,211,243,.14)" stroke="rgba(25,211,243,.4)"/>';
  if(BUFFER/1e5>=mn&&BUFFER/1e5<=mx){var by=Y(BUFFER);s+='<line x1="'+x0+'" y1="'+by+'" x2="'+x1+'" y2="'+by+'" stroke="#F5B700" stroke-width="2" stroke-dasharray="6 4"/><text x="'+(x1)+'" y="'+(by-6)+'" text-anchor="end" font-size="13" font-weight="700" fill="#F5B700">Buffer ₹1.0 L</text>';}
  for(i=0;i<n;i+=7){s+='<text x="'+X(i)+'" y="258" text-anchor="middle" font-size="12" fill="#86A9B6">'+fmtDate(F.dates[i])+'</text>';}
  s+='<polyline points="'+F.balance.map(function(v,i){return X(i).toFixed(1)+','+Y(v).toFixed(1);}).join(' ')+'" fill="none" stroke="#19D3F3" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>';
  var emi=D.warnings.filter(function(w){return w.type==='emi_due';})[0];
  if(emi){var ei=F.dates.indexOf(emi.date);if(ei>0){var d=F.balance[ei]-F.balance[ei-1],ex=X(ei),ey=Y(F.balance[ei]);s+='<circle cx="'+ex+'" cy="'+ey+'" r="5" fill="#07111A" stroke="#F5B700" stroke-width="2.5"/><text x="'+(ex+11)+'" y="'+(ey-11)+'" font-size="13" font-weight="700" fill="#F5B700">EMI '+fmtL(d)+'</text>';}}
  var mi=0;F.balance.forEach(function(v,i){if(v<F.balance[mi])mi=i;});
  var mxp=X(mi),myp=Y(F.balance[mi]),lowNeg=F.balance[mi]<0,flip=mxp>640;
  s+='<circle cx="'+mxp+'" cy="'+myp+'" r="6" fill="'+(lowNeg?'#FF5A52':'#19D3F3')+'" stroke="#07111A" stroke-width="2"/><text x="'+(flip?mxp-11:mxp+11)+'" y="'+(myp+(lowNeg?20:-12))+'" text-anchor="'+(flip?'end':'start')+'" font-size="13" font-weight="700" fill="'+(lowNeg?'#FF8A84':'#19D3F3')+'">Low '+fmtL(F.balance[mi])+'</text>';
  if(neg.length){var cx=(X(neg[0])+X(neg[neg.length-1]))/2;s+='<text x="'+cx+'" y="38" text-anchor="middle" font-size="13" font-weight="700" fill="#FF8A84">Gap</text><text x="'+cx+'" y="53" text-anchor="middle" font-size="12" fill="#FF8A84">'+fmtRange(F.dates[neg[0]],F.dates[neg[neg.length-1]])+'</text>';}
  var label='Cash balance line chart over '+n+' days from '+fmtDate(F.dates[0])+'. Starts at '+fmtL(F.balance[0])+', lowest point '+fmtL(F.balance[mi])+' on '+fmtDate(F.dates[mi])+', ends at '+fmtL(F.balance[n-1])+'.';
  return '<svg viewBox="0 0 '+W+' 270" style="width:100%;height:auto;display:block" role="img" aria-label="'+esc(label)+'">'+s+'</svg>';
}
function flowsChart(D){
  var F=D.forecast,n=F.dates.length,wk=[],i;
  for(i=0;i<n;i+=7){var e=Math.min(n,i+7),a=0,b=0;for(var j=i;j<e;j++){a+=F.inflows[j];b+=F.outflows[j];}wk.push({from:F.dates[i],to:F.dates[e-1],a:a,b:b});}
  var m=Math.max.apply(null,wk.map(function(w){return Math.max(w.a,w.b);}))||1;
  return '<div class="scroll"><div class="flows">'+wk.map(function(w){var net=w.a-w.b;return '<div class="g"><div class="b"><div class="c"><span>'+(w.a/1e5).toFixed(1)+'</span><div style="width:30px;height:'+Math.max(2,Math.round(115*w.a/m))+'px;background:#19D3F3"></div></div><div class="c"><span>'+(w.b/1e5).toFixed(1)+'</span><div style="width:30px;height:'+Math.max(2,Math.round(115*w.b/m))+'px;background:#F5B700"></div></div></div><div class="num mut" style="font-size:12px;text-align:center">'+fmtRange(w.from,w.to)+'</div><div class="num" style="font-size:13px;color:'+(net<0?'#FF8A84':'#3DDC97')+'">net '+(net<0?'–':'+')+Math.abs(net/1e5).toFixed(2).replace(/\.?0+$/,'')+'</div></div>';}).join('')+'</div></div>';
}

}

function loanOptions(D){
  var s=D.safe_loan_amount,o=[0,100000];
  if(s!=null){o.push(s);o.push(250000);}else{o.push(250000);o.push(500000);}
  var u=[];o.sort(function(a,b){return a-b;}).forEach(function(v){if(u.indexOf(v)<0)u.push(v);});
  return u;
}
function renderWarnings(){
  var D=S.data,g=D.gap,opts=loanOptions(D),sl=D.safe_loan_amount;
  if(S.loan==null||S.loan>=opts.length)S.loan=sl!=null?opts.indexOf(sl):0;
  var amt=opts[S.loan],low=g.min_balance+amt,gapTxt=!g.has_gap?'No Deficit':low<0?'Deficit Remains':'Deficit Resolved',gapCls=low<0?'hi':'ok',bufTxt=low>=BUFFER?'Buffer Maintained':'Below Buffer Limit',bufCls=low>=BUFFER?'ok':'md';

  var ws=D.warnings.map(function(w){return '<article class="panel wcard '+esc(w.severity)+'" style="padding:20px 24px"><div style="display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px">'+sevChip(w.severity)+'<span class="num mut" style="font-size:13px">'+esc(w.type)+'</span><span class="num mut" style="margin-left:auto;font-size:13px">'+esc(w.date)+'</span></div><p style="font-size:20px;line-height:1.4">'+esc(w.message)+'</p><div class="act"><span class="lbl">Recommended Action</span><div style="margin-top:4px;font-size:18px">'+esc(w.action)+'</div></div></article>';}).join('');
  var btns=opts.map(function(v,i){return '<button type="button" class="loan" data-loan="'+i+'" aria-pressed="'+(S.loan===i)+'">'+(v===0?'None':'₹'+(v/100000).toFixed(1)+' L')+'</button>';}).join('');
  var an=D.anomalies.length?'<div class="scroll"><table><thead><tr><th>type</th><th>severity</th><th>ref_id</th><th>message</th></tr></thead><tbody>'+D.anomalies.map(function(a){return '<tr><td class="num" style="font-size:14px">'+esc(a.type)+'</td><td>'+sevChip(a.severity)+'</td><td class="num" style="font-size:14px">'+esc(a.ref_id)+'</td><td>'+esc(a.message)+'</td></tr>';}).join('')+'</tbody></table></div>':'<p style="padding:0 24px 16px;font-size:18px" class="mut">No ledger discrepancies or anomalies detected across transactions.</p>';
  $('v-warnings').innerHTML=head(4,'Risk Alerts & Scenario Planning',D.warnings.length+' active risk alert'+(D.warnings.length===1?'':'s')+': '+cnt.high+' high, '+cnt.medium+' medium, '+cnt.low+' low severity. Includes actionable mitigation steps.')+
  '<div class="row" style="align-items:flex-start"><div style="flex:2 1 520px;display:flex;flex-direction:column;gap:16px;min-width:0">'+ws+'</div>'+
  '<aside class="panel" style="flex:1 1 320px"><div class="lbl">Scenario Simulator</div><h2 class="ttl" style="margin:8px 0 12px">Recommended Bridge Loan</h2><div class="lbl" style="color:var(--muted)">safe_loan_amount</div><div class="num" style="font-size:38px;margin-top:4px;text-shadow:0 0 14px rgba(25,211,243,.5)">'+(sl!=null?fmtL(sl,1):'None Required')+'</div>'+
  '<p class="mut" style="margin:6px 0 18px">'+(sl!=null?'Minimum capital injection required to preserve the ₹1.0 L cash safety buffer. Test alternative capital amounts:':'No capital injection is required as the forecast maintains safety buffer compliance. You can test custom loan amounts:')+'</p><div style="display:flex;flex-wrap:wrap;gap:8px">'+btns+'</div>'+
  '<div style="margin-top:20px;padding:16px;border:1px solid rgba(25,211,243,.3);background:rgba(25,211,243,.05);display:flex;flex-direction:column;gap:12px"><div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline"><span class="mut">Projected Balance Minimum</span><span class="num" style="font-size:22px;color:'+(low<0?'#FF8A84':'var(--fg)')+'">'+fmtL(low)+'</span></div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span class="mut">Liquidity Deficit Status</span><span class="chip '+gapCls+'">'+gapTxt+'</span></div><div style="display:flex;justify-content:space-between;gap:12px;align-items:center"><span class="mut">₹1.0 L Buffer Compliance</span><span class="chip '+bufCls+'">'+bufTxt+'</span></div></div>'+
  '<p class="mut" style="margin-top:14px;font-size:16px">Note: Repayment amortization and interest rates are excluded from this baseline scenario simulation.</p></aside></div>'+
  '<section class="panel" style="padding-left:0;padding-right:0;padding-bottom:8px"><div style="padding:0 24px 16px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 16px"><h2 class="ttl">Data Integrity & Anomaly Flags</h2><span class="num mut" style="font-size:13px">'+D.anomalies.length+' flagged</span></div>'+an+'</section>'+
  '<div><button type="button" class="btn ghost" data-go="upload">Return to Data Upload</button></div>';
}

function notice(msg,err){var n=$('notice');if(!msg){n.hidden=true;return;}n.className='notice'+(err?' err':'');n.textContent=msg;n.hidden=false;}
function renderAll(){renderNav();renderUpload();renderForecast();renderHealth();renderWarnings();}
function go(v){S.view=v;VIEWS.forEach(function(x){$('v-'+x[0]).hidden=(x[0]!==v);});renderNav();window.scrollTo(0,0);}
var REQ=['msme_id','as_of','currency','summary','forecast','gap','score','receivables_aging','metrics','explanations','anomalies','warnings','safe_loan_amount'];
function validate(j){
  var miss=REQ.filter(function(k){return j==null||j[k]===undefined;});
  if(miss.length)return 'This JSON is missing: '+miss.join(', ')+'.';
  if(typeof j.summary.current_balance!=='number'||typeof j.summary.health_score!=='number')return 'summary needs numeric current_balance and health_score.';
  var F=j.forecast,L=F&&F.dates&&F.dates.length;
  if(!L||['balance','lower','upper','inflows','outflows'].some(function(k){return !F[k]||F[k].length!==L;}))return 'forecast needs dates, balance, lower, upper, inflows and outflows, all the same length.';
  if(!j.score.sub_scores||!j.score.band)return 'score needs a band and sub_scores.';
  if(!j.gap||!Array.isArray(j.gap.causes))return 'gap needs a causes array.';
  return null;
}
function readFile(f){
  var r=new FileReader();
  r.onload=function(){
    var txt=String(r.result);
    if(/\.json$/i.test(f.name)||f.type==='application/json'){
      var j;try{j=JSON.parse(txt);}catch(e){notice('Invalid file format: '+e.message,true);return;}
      var err=validate(j);if(err){notice(err,true);return;}
      S.data=j;S.loaded=f.name;S.sample=-1;S.loan=null;notice('Successfully loaded '+f.name+'. Open Cash Forecast to view analytics.');renderAll();
    }else{
      var lines=txt.split(/\r?\n/).filter(Boolean);
      if(lines.length<2){notice('Selected CSV file contains no valid data rows.',true);return;}
      S.previewHead=lines[0].split(',').map(function(s){return s.trim();});
      S.preview=lines.slice(1,6).map(function(l){return l.split(',').map(function(s){return s.trim();});});
      S.previewNote=f.name+' · '+(lines.length-1)+' total records · 5 sample rows displayed';
      notice('Parsed '+(lines.length-1)+' transaction rows from '+f.name+'. Diagnostic forecasting requires model output JSON.');
      renderUpload();
    }
  };
  r.readAsText(f);
}
